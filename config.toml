BaseURL = "https://erickhun.com/"
title = "Eric Khun"
theme = "hugo-coder"
languagecode = "en"
defaultcontentlanguage = "en"

paginate = 30
canonifyurls = true

pygmentsstyle = "bw"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

# disqusShortname = "erickhun"
googleAnalytics = "UA-106516-7"

[params]
    author = "Eric Khun"
    info = "after 11 years running infrastructure at <a href=\"https://buffer.com\">buffer</a>,<br/> I quit to build my own things with AI"
    description = "I write about AI - Taiwan - Scalability - Infrastructure - Engineering"
    keywords = "blog, developer, personal, data"
    avatarurl = "img/eric.jpg"

    favicon_32 = "/img/favicon-32x32.png"
    favicon_16 = "/img/favicon-16x16.png"

    footercontent = "Currently building <a href=\"https://heylife.ai\">heylife</a>, an app to always be ready for all your events in your calendar, among others. <a href=\"/about\">Feel free to contact me</a>"

    hidecredits = true
    hidecopyright = true

    rtl = false

    math = true
    custom_css = ["css/custom.css"]


